name: Upload approved player portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/portrait-upload.json'
      - '.github/workflows/portrait-upload.yml'
      - 'automation/portrait_upload.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: fcb-wnba-main
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip -q install 'pillow>=11.3,<13'
      - name: Receive and validate the complete approved original
        id: upload
        env:
          REQUEST_COMMIT: ${{ github.sha }}
        run: python automation/portrait_upload.py
      - name: Run the existing page publisher and live verification
        if: steps.upload.outputs.uploaded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$REPO/actions/workflows/fcb-wnba.yml/dispatches" -f ref=main -F inputs[force]=false
