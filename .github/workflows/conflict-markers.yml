name: Conflict markers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail if a tracked file or built page contains a git conflict marker
        run: python -m unittest discover -s automation -p 'test_no_conflict_markers.py' -v
