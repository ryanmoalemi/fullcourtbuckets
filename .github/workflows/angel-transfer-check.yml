name: Stage approved Angel artwork
on:
  push:
    branches: [main]
    paths: ['.github/workflows/angel-transfer-check.yml']
permissions:
  contents: read
concurrency:
  group: fcb-wnba-main
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stage only the owner-approved public artwork
        run: |
          python - <<'PY'
          import urllib.request,hashlib,time
          from pathlib import Path
          url='https://sdmntprwestus3.oaiusercontent.com/files/00000000-c074-81fd-8996-55b09f259e34/raw?se=2026-09-16T19%3A30%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=e2e4901d-2389-5c73-8cea-02cdc2c52004&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T18%3A27%3A19Z&ske=2026-09-17T18%3A27%3A19Z&sks=b&skv=2026-02-06&sig=cBv4TrsRLuEfFZUPOex%2BK3g5eO4%2BddttXkJy2E1F6dE%3D'
          expected='647a143bf181503f2ac3aa14df6d68f2a917e9d95f6349aac4029879dc72d450'
          target=Path('images/players/angel-reese-approved-v2.webp')
          for attempt in range(3):
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(2000001)
                  assert len(raw)==118584 and hashlib.sha256(raw).hexdigest()==expected
                  target.write_bytes(raw)
                  print('Verified approved artwork:',len(raw),expected)
                  break
              except Exception as error:
                  if attempt==2:
                      raise SystemExit('Transfer failed: '+type(error).__name__+' '+str(getattr(error,'code',''))) from None
                  time.sleep(2)
          PY
          git config user.name 'Full Court Buckets updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- images/players/angel-reese-approved-v2.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Store user-approved Angel portrait at 640x650, not a thumbnail'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
