name: FAQ and stat text check
on:
  schedule:
    - cron: '45 6 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faq-stat-consistency
  cancel-in-progress: false
jobs:
  heal:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate mismatched FAQ, meta, and schema text
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python automation/heal_stat_text.py
      - name: Publish repaired player pages
        run: |
          git config user.name 'Full Court Buckets updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wnba
          if git diff --cached --quiet; then
            echo 'No player pages needed a repair.'
            exit 0
          fi
          git commit -m 'Repair player FAQ and meta text that disagreed with the stats.'
          git pull --rebase origin main
          git push origin HEAD:main
