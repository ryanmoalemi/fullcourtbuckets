name: Repair approved Angel portrait
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-angel-approved.yml']
permissions:
  contents: read
concurrency:
  group: fcb-wnba-main
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode the approved asset and preserve existing player data
        env:
          APPROVED_ARTWORK_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-a5a4-8230-a4ed-19b168f6b7ad/raw?se=2026-09-16T19%3A24%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=1f4157ac-d88d-518f-942d-37be464baa14&skoid=4b04981f-b1dc-41e0-a770-8ce0d5c8f411&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A09%3A40Z&ske=2026-09-16T22%3A09%3A40Z&sks=b&skv=2026-02-06&sig=UL3l9gSQ1OLzCzTvKCDu9YbkbV6W0KT4AL3fNMOqSjM%3D'
        run: |
          python -m pip -q install 'Pillow==11.3.0'
          python - <<'PY'
          import hashlib, io, json, os, urllib.request
          from pathlib import Path
          from PIL import Image
          expected = '647a143bf181503f2ac3aa14df6d68f2a917e9d95f6349aac4029879dc72d450'
          relative = 'images/players/angel-reese-approved-v2.webp'
          target = Path(relative)
          if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest() == expected:
              content = target.read_bytes()
          else:
              try:
                  with urllib.request.urlopen(os.environ['APPROVED_ARTWORK_URL'], timeout=45) as response:
                      content = response.read(2000001)
              except Exception:
                  raise SystemExit('Approved artwork transfer failed. No image or manifest was replaced.') from None
          assert len(content) == 118584, 'Wrong artwork size'
          assert hashlib.sha256(content).hexdigest() == expected, 'Approved artwork checksum mismatch'
          image = Image.open(io.BytesIO(content)); image.load()
          assert image.format == 'WEBP' and image.size == (640,650), 'Wrong decoded dimensions'
          assert image.mode == 'RGBA' and image.getchannel('A').getextrema() == (0,255), 'Transparency missing'
          manifest_path = Path('content/player-illustrations.json')
          manifest = json.loads(manifest_path.read_text())
          matches = [r for r in manifest['portraits'] if r['player_id'] == 721]
          assert len(matches) == 1 and matches[0]['slug'] == 'angel-reese' and matches[0]['player_name'] == 'Angel Reese'
          before_other = [r.copy() for r in manifest['portraits'] if r['player_id'] != 721]
          profile = json.loads(Path('data/wnba/players/angel-reese.json').read_text())
          assert profile['player']['id'] == 721 and profile['slug'] == 'angel-reese'
          baseline = {}
          for r in manifest['portraits']:
              p = Path(r['src'].lstrip('/'))
              if r['player_id'] != 721 and p.is_file():
                  baseline[r['src']] = hashlib.sha256(p.read_bytes()).hexdigest()
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(content)
          matches[0].update(src='/' + relative, width=640, height=650,
              source='The replacement Angel Reese illustration explicitly approved by the owner in chat. Exported from the 1254x1254 RGBA master, not enlarged from the previous 192px thumbnail.',
              display='Approved compact Caitlin layout, unchanged. Native transparent head-and-shoulders image, original purple gradient and circles, no square card or visible caption; all names and statistics remain HTML.',
              quality_standard='fcb-portrait-640x650-v2', asset_sha256=expected,
              export_settings={'format':'WEBP','width':640,'height':650,'quality':95,'method':6,'exact':True,'source_width':1254,'source_height':1254,'upscaled':False})
          matches[0].pop('mask', None)
          assert before_other == [r for r in manifest['portraits'] if r['player_id'] != 721]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          policy = {'version':'fcb-portrait-640x650-v2','minimum_width':640,'minimum_height':650,
              'preferred_width':640,'preferred_height':650,'preferred_format':'WEBP',
              'export_quality':95,'export_method':6,'native_alpha_required':True,'no_upscaling':True,
              'minimum_master_width':1024,'minimum_master_height':1024,
              'layout_reference':'/wnba/caitlin-clark/', 'portrait_rollout_paused_for_quality_review':True,
              'next_user_approved_replacement':'aja-wilson',
              'unchanged_legacy_assets':baseline,
              'legacy_note':'These already-published bytes are exempt only to avoid blocking statistics refreshes. They are not the standard for new portraits; undersized assets need separate replacements.'}
          Path('content/portrait-quality.json').write_text(json.dumps(policy, indent=2) + '\n')
          Path('automation/PORTRAIT_QUALITY.md').write_text('''# Approved portrait output standard\n\nThe owner rejected blurry enlarged thumbnail exports. The approved Caitlin canvas is 640 x 650. Use the approved Angel replacement as the second sharpness reference.\n\nGenerate or use a master at least 1024 x 1024. Never enlarge a thumbnail. Preserve the approved face. Export a native-transparent WebP at 640 x 650 using Pillow quality=95, method=6, exact=True, with proportional cropping and no stretching. Keep the full-resolution master when possible. Do not downsize to 160, 192, 256 or 480 pixels for the hero.\n\nKeep the existing compact desktop/mobile CSS, HTML player name and statistics, purple gradient, circles and faint outline number. No square number card and no visible caption. A new asset filename plus the existing content-hash query prevents reuse of the old thumbnail.\n\nThe unattended portrait rollout is paused for quality review. The next specifically user-approved replacement is A'ja Wilson. Do not regenerate that approved source or claim it is live before committing and verifying it.\n\nA completed publication requires a successful deployment AND a live page referencing the new filename AND downloaded live image bytes matching the approved checksum and decoded dimensions. A local preview, upload to Drive, or source-code commit alone is not a publication.\n''')
          Path('automation/test_portrait_quality_policy.py').write_text('''"""Prevent new hero portraits from silently becoming enlarged thumbnails."""\nimport hashlib\nimport json\nfrom pathlib import Path\nimport unittest\n\nclass PortraitQualityPolicyTests(unittest.TestCase):\n    def test_new_portraits_have_production_resolution(self):\n        root=Path(__file__).resolve().parents[1]\n        policy=json.loads((root/'content/portrait-quality.json').read_text())\n        records=json.loads((root/'content/player-illustrations.json').read_text())['portraits']\n        for record in records:\n            with self.subTest(player=record['slug']):\n                raw=(root/record['src'].lstrip('/')).read_bytes()\n                digest=hashlib.sha256(raw).hexdigest()\n                if policy['unchanged_legacy_assets'].get(record['src']) == digest:\n                    continue\n                self.assertGreaterEqual(record['width'],640)\n                self.assertGreaterEqual(record['height'],650)\n                self.assertEqual(record.get('quality_standard'),policy['version'])\n                self.assertEqual(record.get('asset_sha256'),digest)\n                self.assertEqual(raw[:4],b'RIFF')\n                self.assertEqual(raw[8:12],b'WEBP')\n                self.assertEqual(int.from_bytes(raw[4:8],'little')+8,len(raw))\n                offset=12\n                dimensions=None\n                while offset+8<=len(raw):\n                    tag=raw[offset:offset+4]\n                    size=int.from_bytes(raw[offset+4:offset+8],'little')\n                    payload=raw[offset+8:offset+8+size]\n                    self.assertEqual(len(payload),size)\n                    if tag==b'VP8X':\n                        self.assertGreaterEqual(len(payload),10)\n                        self.assertTrue(payload[0]&16,'Native alpha required')\n                        dimensions=(int.from_bytes(payload[4:7],'little')+1,int.from_bytes(payload[7:10],'little')+1)\n                    offset+=8+size+(size%2)\n                self.assertEqual(dimensions,(record['width'],record['height']))\n\nif __name__=='__main__':\n    unittest.main()\n''')
          print('Approved replacement decoded: 640 x 650 RGBA WebP, SHA-256 verified. No other portrait changed.')
          PY
      - name: Test and rebuild using existing player layout
        run: |
          python -m unittest discover -s automation -p 'test_*.py' -v
          node --check automation/players.js
          python automation/build_players.py
          python automation/apply_portraits.py
          python automation/rollout_player_design.py
          python - <<'PY'
          from pathlib import Path
          page=Path('wnba/angel-reese/index.html').read_text()
          assert '/images/players/angel-reese-approved-v2.webp?v=647a143bf181' in page
          assert 'angel-reese-portrait-v1.webp' not in page
          assert 'width="640" height="650"' in page
          assert page.count('class="player-illustration"') == 1
          assert '<figcaption' not in page and '<div class="number-card">' not in page
          assert 'fcb-player-compact' in page and '<h1 id="player-name">' in page
          assert '<table>' in page
          print('Generated Angel page uses the approved replacement and unchanged compact layout.')
          PY
      - name: Commit the approved image, mapping and persistent quality standard
        run: |
          git config user.name 'Full Court Buckets updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- images/players/angel-reese-approved-v2.webp content/player-illustrations.json content/portrait-quality.json automation/PORTRAIT_QUALITY.md automation/test_portrait_quality_policy.py wnba data/wnba/illustration-rollout.json data/wnba/illustration-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Replace blurry Angel thumbnail with approved 640x650 portrait'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package the current site without changing statistics
        run: |
          mkdir -p "$RUNNER_TEMP/fcb-angel-site"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/fcb-angel-site"
          rm -rf "$RUNNER_TEMP/fcb-angel-site/.github" "$RUNNER_TEMP/fcb-angel-site/automation"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/fcb-angel-site
  deploy:
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public page and exact approved image bytes
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          expected='647a143bf181503f2ac3aa14df6d68f2a917e9d95f6349aac4029879dc72d450'
          base='https://fullcourtbuckets.com'
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(base+'/wnba/angel-reese/?verify=approved-'+str(time.time_ns()),timeout=30) as response:
                      page=response.read().decode()
                  assert '/images/players/angel-reese-approved-v2.webp?v=647a143bf181' in page
                  assert 'angel-reese-portrait-v1.webp' not in page
                  with urllib.request.urlopen(base+'/images/players/angel-reese-approved-v2.webp?v='+expected[:12],timeout=30) as response:
                      raw=response.read()
                  assert hashlib.sha256(raw).hexdigest()==expected
                  report={'live_verified':True,'page':base+'/wnba/angel-reese/','asset':base+'/images/players/angel-reese-approved-v2.webp','sha256':expected,'bytes':len(raw),'width':640,'height':650,'old_image_reference_present':False}
                  Path('angel-live-verification.json').write_text(json.dumps(report,indent=2)+'\n')
                  print(json.dumps(report))
                  break
              except Exception:
                  if attempt==17:
                      raise SystemExit('Deployment finished, but live asset verification did not pass. Do not report success.') from None
                  time.sleep(10)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: angel-live-verification
          path: angel-live-verification.json
