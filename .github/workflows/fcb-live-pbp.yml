name: FCB live play-by-play (Finals Game 2)
# Ryan, Oct 19 2026: Game 2 play-by-play updates about every 5 minutes while live.
# workflow_dispatch with loop=true runs one job that refreshes every ~5 min until Final
# (cron schedules on GitHub can be delayed or skipped; the schedule is a backup pass).
# On Final: full import + final score check, then the workflow disables itself.
on:
  schedule:
    - cron: '*/5 0-3 20 10 *'   # Oct 20 00:00-03:55 UTC = Oct 19 5:00-8:55 PM PT
  workflow_dispatch:
    inputs:
      loop:
        description: Keep refreshing every ~5 minutes until Final
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: fcb-live-pbp-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Game 2 play-by-play
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOOP: ${{ github.event_name == 'workflow_dispatch' && inputs.loop && '1' || '0' }}
        run: bash automation/live_pbp_loop.sh
