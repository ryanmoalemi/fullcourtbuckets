name: Live play-by-play
# Near-real-time play-by-play for any game set in data/live-pbp.json (Ryan, Oct 21 2026:
# update as soon as new info arrives). One long-running job polls the feed every 30 s, commits
# only when the play count changes, and pushes at most once a minute so Pages builds keep up.
# Public repo: Actions minutes are free; one ~3 h job per game.
# On Final: full box-score import into the SAME game file, final page, guard check, push.
# Schedules only fire from the default branch (master); the job always runs main's scripts.
on:
  schedule:
    # Game 5: Mon Oct 26 2026, 5 p.m. PT tip = 00:00 UTC Oct 27. Start 4:30 p.m. PT; 5:15 backup if the first is skipped.
    - cron: '30 23 26 10 *'
    - cron: '15 0 27 10 *'
  workflow_dispatch:
    inputs:
      loop:
        description: Keep polling until Final
        type: boolean
        default: true
      dry_run:
        description: Commit locally only, never push
        type: boolean
        default: false
      ref:
        description: Branch whose scripts and data to use
        default: main
permissions:
  contents: write
concurrency:
  group: fcb-live-pbp
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live play-by-play loop
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          LOOP: ${{ (github.event_name == 'schedule' || inputs.loop) && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          POLL_SECONDS: '30'
          MIN_PUSH_SECONDS: '30'
        run: bash automation/live_pbp_loop.sh
