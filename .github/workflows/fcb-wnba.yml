name: Full Court Buckets WNBA updater
on:
  schedule:
    - cron: '17 4 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if the normal daily/weekly interval has not elapsed
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'content/player-illustrations.json'
      - 'images/players/**'
      - '.github/workflows/fcb-wnba.yml'
permissions:
  contents: read
concurrency:
  group: fcb-wnba-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  dispatch-to-production:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch to the website branch, never deploy obsolete master content
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/workflows/fcb-wnba.yml/dispatches" -f ref=main -F inputs[force]=false
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.key.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portrait verification dependencies
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          # A quiet `playwright install --with-deps` once sat on apt/download until the
          # 90-minute job timeout cancelled the sync (run 37829289612) and skipped deploy.
          # Keep the log, fail a stalled attempt, and retry instead of burning the job.
          set -euo pipefail
          sudo -n tee /etc/apt/apt.conf.d/99fcb-lock-timeout >/dev/null <<'EOF'
          DPkg::Lock::Timeout "120";
          Acquire::Retries "3";
          EOF
          run_bounded() {
            local label="$1"
            shift
            local attempt status
            for attempt in 1 2 3; do
              echo "::group::${label} (attempt ${attempt}/3)"
              if timeout --kill-after=20s 8m "$@"; then
                echo "::endgroup::"
                return 0
              fi
              status=$?
              echo "::endgroup::"
              echo "${label} attempt ${attempt} failed (exit ${status})." >&2
              if [ "$attempt" -lt 3 ]; then
                sleep 15
              fi
            done
            echo "${label} failed after 3 attempts." >&2
            return 1
          }
          run_bounded "Install Python packages" \
            python -m pip install --timeout 60 --retries 3 'pillow>=11.3,<13' 'playwright>=1.50,<2'
          run_bounded "Install Playwright Chromium" \
            python -m playwright install --with-deps chromium
      - name: Quarantine the audited corrupt portrait and bind existing approvals
        run: python automation/portrait_migration_20260916.py
      - name: Test data safety and page builder without credentials
        run: |
          python -m unittest discover -s automation -p 'test_*.py' -v
          node --check automation/players.js
      - name: Check the private API secret
        id: key
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          if [ -n "$BALLDONTLIE_API_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'API key missing. No authenticated import or player-page publication occurred.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Import and validate WNBA data on the daily or weekly cadence
        if: steps.key.outputs.ready == 'true'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          FORCE_REFRESH: ${{ inputs.force || false }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python -u automation/wnba_sync.py --force
          else
            python -u automation/wnba_sync.py
          fi
      - name: Rebuild standings from the ESPN feed
        if: steps.key.outputs.ready == 'true'
        run: python automation/build_standings.py
      - name: Build every player page from the verified local data
        if: steps.key.outputs.ready == 'true'
        run: |
          python automation/build_players.py
          python automation/apply_portraits.py
          python automation/rollout_player_design.py
      - name: Resize and convert images, then fill in dimensions and lazy-loading
        run: python automation/optimize_images.py
      - name: Check generated pages and sitemap before publication
        if: steps.key.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          entries=json.loads(Path('data/wnba/players-index.json').read_text())['players']
          duplicate_ids={99338}
          indexable=[]
          for p in entries:
              page=Path('wnba')/p['slug']/'index.html'
              text=page.read_text()
              if p['id'] in duplicate_ids or 'http-equiv="refresh"' in text:
                  assert 'noindex' in text, p['slug']
                  assert 'http-equiv="refresh"' in text, p['slug']
                  continue
              assert text.count('<h1 ')==1, p['slug']
              assert 'BALLDONTLIE_API_KEY' not in text, p['slug']
              assert f'https://fullcourtbuckets.com/wnba/{p["slug"]}/' in text, p['slug']
              assert 'fcb-player-compact' in text, p['slug']
              assert '<div class="number-card">' not in text, p['slug']
              if 'noindex' not in text:
                  indexable.append(p)
          portraits=json.loads(Path('content/player-illustrations.json').read_text())['portraits']
          for portrait in portraits:
              text=(Path('wnba')/portrait['slug']/'index.html').read_text()
              assert 'class="player-illustration"' in text
              assert portrait['src'] in text
              if portrait.get('kind') == 'photograph':
                  assert f'alt="{portrait["player_name"]}"' in text
                  assert 'illustrated portrait' not in text
                  assert 'AI-generated illustration' not in text
                  assert 'The number artwork is a design element, not a player photograph.' not in text
              else:
                  assert 'AI-generated illustration' in text
          rollout=json.loads(Path('data/wnba/illustration-rollout.json').read_text())
          assert rollout['profile_count']==len(entries)
          assert rollout['profiles_with_approved_illustrations']==len(portraits)
          assert rollout['profiles_awaiting_illustrations']==len(entries)-len(portraits)
          NS='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          player_locs={el.find(f'{NS}loc').text for el in ET.parse('player-sitemap.xml').getroot()}
          assert player_locs=={f'https://fullcourtbuckets.com/wnba/{p["slug"]}/' for p in indexable}
          assert Path('wnba/assets/players.css').stat().st_size>1000
          print(f'Validated {len(entries)} compact profiles, approved artwork and sitemap.')
          PY
      - name: Verify decoded portrait bytes and local desktop/mobile rendering
        if: steps.key.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/portrait-publish-plan"
          python automation/verify_portraits.py --create-plan --plan "$RUNNER_TEMP/portrait-publish-plan/plan.json"
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/portrait-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          python automation/verify_portraits.py --plan "$RUNNER_TEMP/portrait-publish-plan/plan.json" --origin http://127.0.0.1:8765 --output "$RUNNER_TEMP/portrait-local-qa"
          cp automation/verify_portraits.py "$RUNNER_TEMP/portrait-publish-plan/verify_portraits.py"
      - uses: actions/upload-artifact@v4
        if: success() && steps.key.outputs.ready == 'true'
        with:
          name: portrait-publish-plan
          path: ${{ runner.temp }}/portrait-publish-plan
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-local-verification
          path: ${{ runner.temp }}/portrait-local-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Reject git conflict markers in tracked files and built pages
        if: steps.key.outputs.ready == 'true'
        run: python automation/test_no_conflict_markers.py
      - name: Commit validated data and generated player pages
        if: steps.key.outputs.ready == 'true'
        run: |
          git config user.name 'Full Court Buckets updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/wnba wnba index.html robots.txt player-sitemap.xml sitemap.xml pages-sitemap.xml sitemap/index.html docs/missing-data.md standings/index.html api/wnba-standings about/index.html authors/ryan-moalemi/index.html how-we-make-full-court-buckets/index.html contact/index.html privacy/index.html terms/index.html 404.html assets/site-nav.css assets/site-nav.js content/player-illustrations.json content/portrait-quality.json content/portrait-rollout.json content/portrait-quarantine.json images logo.png logo.webp articles.json docs/missing-alt.md docs/image-optimize.log
          python -c "import json; arts=json.load(open('articles.json')); print('\n'.join(['news/index.html']+[p for a in arts for p in ('news/'+a['slug']+'/index.html', a['slug']+'/index.html')]))" | xargs -d '\n' git add --
          python -c "import sys; sys.path.insert(0,'automation'); import build_players as b; print('\n'.join(sorted(b.REMOVED_ADU_PATHS)))" | xargs -d '\n' git add --
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh WNBA data and generated player profiles'
            # The builder can leave files outside the commit. Rebase refuses a dirty tree.
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push -u -m 'leftover build files'
            fi
            git pull --rebase origin main
            git push origin HEAD:main
            git stash drop || true
          fi
      - name: Prepare existing website and generated profiles
        if: steps.key.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fcb-site"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/fcb-site"
          rm -rf "$RUNNER_TEMP/fcb-site/.github" "$RUNNER_TEMP/fcb-site/automation" "$RUNNER_TEMP/fcb-site/portrait-masters" "$RUNNER_TEMP/fcb-site/portrait-handoff" "$RUNNER_TEMP/fcb-site/data/games"
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'automation')
          import build_players as builder
          root = Path(os.environ['RUNNER_TEMP']) / 'fcb-site'
          bad = []
          for relative in sorted(builder.REMOVED_ADU_PATHS):
              path = root / relative
              text = path.read_text(encoding='utf-8') if path.is_file() else ''
              if text != builder.adu_redirect_html(relative):
                  bad.append(relative)
              if 'googletagmanager' in text or 'gtag(' in text or 'G-ZJK92LK3XT' in text:
                  bad.append(relative + ' analytics')
          if bad:
              raise SystemExit('ADU redirect stubs missing from the Pages artifact: ' + ', '.join(bad))
          print(f'Pages artifact keeps {len(builder.REMOVED_ADU_PATHS)} ADU redirect stubs.')
          PY
      - name: Reject git conflict markers in the Pages artifact
        if: steps.key.outputs.ready == 'true'
        run: python automation/test_no_conflict_markers.py "$RUNNER_TEMP/fcb-site"
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.ready == 'true'
        with:
          path: ${{ runner.temp }}/fcb-site
      - name: Report build failure
        if: failure()
        run: echo 'Update failed. No partial site from this run was deployed. Review this Actions run.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified website and player pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: portrait-publish-plan
          path: ${{ runner.temp }}/portrait-publish-plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: main
          fetch-depth: 20
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: python automation/indexnow.py || true
      - name: Install real desktop and Safari-engine browsers
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          # Same bound as the sync install: a silent apt or browser download must not
          # hang this job. Logs stay on, each attempt dies after 8 minutes, then retries.
          set -euo pipefail
          sudo -n tee /etc/apt/apt.conf.d/99fcb-lock-timeout >/dev/null <<'EOF'
          DPkg::Lock::Timeout "120";
          Acquire::Retries "3";
          EOF
          run_bounded() {
            local label="$1"
            shift
            local attempt status
            for attempt in 1 2 3; do
              echo "::group::${label} (attempt ${attempt}/3)"
              if timeout --kill-after=20s 8m "$@"; then
                echo "::endgroup::"
                return 0
              fi
              status=$?
              echo "::endgroup::"
              echo "${label} attempt ${attempt} failed (exit ${status})." >&2
              if [ "$attempt" -lt 3 ]; then
                sleep 15
              fi
            done
            echo "${label} failed after 3 attempts." >&2
            return 1
          }
          run_bounded "Install Python packages" \
            python -m pip install --timeout 60 --retries 3 'playwright>=1.50,<2'
          run_bounded "Install Playwright Chromium and WebKit" \
            python -m playwright install --with-deps chromium webkit
      - name: Verify approved files on the actual public player pages
        run: |
          python "$RUNNER_TEMP/portrait-publish-plan/verify_portraits.py" --plan "$RUNNER_TEMP/portrait-publish-plan/plan.json" --origin https://fullcourtbuckets.com --output "$RUNNER_TEMP/portrait-live-qa" --engines chromium,webkit --retries 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portrait-live-verification
          path: ${{ runner.temp }}/portrait-live-qa
          if-no-files-found: error
          retention-days: 14
      - name: Report verified publication
        if: success()
        run: echo 'Live portrait byte hashes, player IDs, image decoding, and desktop/mobile layout checks passed in Chromium and WebKit. Evidence is in portrait-live-verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report unverified publication
        if: failure()
        run: echo 'Do not mark this publication verified. At least one live portrait check failed. Inspect portrait-live-verification before proceeding to the next player.' >> "$GITHUB_STEP_SUMMARY"
