name: Dispatch WNBA sync once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-wnba-sync-once.yml'
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start the production WNBA sync on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/workflows/fcb-wnba.yml/dispatches" -f ref=main -F inputs[force]=true
