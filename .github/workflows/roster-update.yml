name: Roster update
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fcb-roster-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test roster updater fail-safes
        run: python -m unittest scripts.test_roster_update -v
      - name: Refresh teams and stats from ESPN
        id: roster
        run: python scripts/roster_update.py
      - name: Commit roster changes
        if: steps.roster.outputs.commit == 'true'
        env:
          MESSAGE: ${{ steps.roster.outputs.message }}
        run: |
          git config user.name 'Full Court Buckets updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- players.json players
          if ! git diff --cached --quiet; then
            git commit -m "$MESSAGE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
